 return '<svg class="real-plate" viewBox="0 0 520 112" preserveAspectRatio="none" role="img" aria-label="Номер '+p.letters[0]+p.digits+p.letters.slice(1)+' регион '+p.region+(b?', жирное начертание':'')+'"><rect x="1" y="1" width="518" height="110" rx="7" fill="#222"/><rect x="6" y="6" width="367" height="100" rx="4" fill="#f1f2ef" stroke="#85847c" stroke-width="1.3"/><rect x="377" y="6" width="137" height="100" rx="4" fill="#f1f2ef" stroke="#85847c" stroke-width="1.3"/>'+marks+'<text x="397" y="99" font-family="Arial,sans-serif" font-size="22" font-weight="500" letter-spacing="1" fill="#171717">RUS</text><path d="M461 82 H497 V88 H461Z" fill="#fff"/><path d="M461 88 H497 V94 H461Z" fill="#2355a5"/><path d="M461 94 H497 V100 H461Z" fill="#cc333a"/><rect x="461" y="82" width="36" height="18" fill="none" stroke="#777" stroke-width=".7"/><circle cx="16" cy="56" r="3.2" fill="#9b8049"/><circle cx="504" cy="56" r="3.2" fill="#9b8049"/><path d="M13 56 H19 M501 56 H507" stroke="#333" stroke-width="1"/></svg>';
}

function car(c,p,interactive=true){const v=CAR_FRAMES[c.id],tag=interactive?'button':'div';const photo='<svg aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%;overflow:hidden" preserveAspectRatio="xMidYMid meet" viewBox="'+v.x+' '+v.top+' '+v.width+' '+v.height+'"><defs><clipPath id="frame-'+c.id+'"><rect x="'+v.x+'" y="'+v.top+'" width="'+v.width+'" height="'+v.height+'"/></clipPath></defs><image clip-path="url(#frame-'+c.id+')" width="'+v.iw+'" height="'+v.ih+'" href="'+v.asset+'"/></svg>';return '<'+tag+' class="car-photo" '+(interactive?'data-view-car="'+c.id+'" aria-label="Рассмотреть '+c.name+'"':'')+' style="background-image:none;aspect-ratio:'+v.width+'/'+v.height+';--plate-y:'+v.y+'%;--plate-h:'+v.h+'%;--plate-w:'+v.w+'%;--plate-font:'+(v.w*.1)+'cqw;--region-font:'+(v.w*.077)+'cqw;--rus-font:'+(v.w*.035)+'cqw">'+photo+(p?'<span class="bumper-plate '+(p.bold?'bumper-bold':'')+'">'+realisticPlate(p)+'</span>':'')+'</'+tag+'>'}
function openCarView(id){let c=CARS.find(x=>x.id===id),owned=state.cars.find(x=>x.id===id),p=owned&&state.plates.find(x=>x.id===owned.plate),d=document.querySelector('#carview');d.innerHTML='<p class="tag">ТВОЯ МАШИНА</p><h2>'+c.name+'</h2>'+car(c,p,false)+(p?'<p class="muted">Установлен: '+p.letters[0]+p.digits+p.letters.slice(1)+' · '+p.region+'</p>':'<p class="muted">Номер пока не установлен</p>')+'<button data-car-close>Закрыть</button>';d.showModal()}
function openPicker(id){if(busy)return;pickerCar=id;pickerPlate=null;const c=CARS.find(x=>x.id===id),available=state.plates.filter(p=>!state.cars.some(c=>c.plate===p.id));const d=document.querySelector('#picker');d.innerHTML='<p class="tag">УСТАНОВКА НОМЕРА</p><h2>'+c.name+'</h2><p class="muted">Выбери номер из своей коллекции</p><div class="plate-options">'+available.map(p=>'<button class="plate-option" data-pick="'+p.id+'">'+plate(p)+'<span class="muted">'+assess(p).label+'</span></button>').join('')+'</div>'+(available.length?'':'<p class="empty">Нет свободных номеров. Сохрани новый или сними с другой машины.</p>')+'<div class="actions"><button class="gold" data-confirm-install disabled>Установить номер</button><button data-picker-close>Отмена</button></div>';d.showModal()}
function openCarPicker(id){
 if(busy||adBusy)return;
 const p=state.plates.find(x=>x.id===id);if(!p)return;
 if(state.cars.some(c=>c.plate===id))return notice('Сначала сними номер с машины.');
 pickerPlate=id;pickerCar=null;
 const available=state.cars.filter(c=>!c.plate),d=document.querySelector('#picker');
 d.innerHTML='<p class="tag">УСТАНОВКА НА МАШИНУ</p><h2>Выбери машину</h2><div class="garage-number picker-number">'+realisticPlate(p)+'</div>'+(available.length?'<p class="muted">Выбери свободную машину из своего гаража.</p><div class="car-options">'+available.map(owned=>{const c=CARS.find(x=>x.id===owned.id);return '<button class="car-option" data-pick-car="'+c.id+'" aria-pressed="false"><h3>'+c.name+'</h3>'+car(c,p,false)+'</button>'}).join('')+'</div>':'<p class="empty">'+(state.cars.length?'На всех машинах уже стоят номера. Сними номер с нужной машины в гараже или коллекции.':'В гараже пока нет машин. Купи первую в магазине.')+'</p>')+'<div class="actions">'+(available.length?'<button class="gold" data-confirm-install disabled>Установить номер</button>':!state.cars.length?'<button class="gold" data-picker-shop>В магазин</button>':'')+'<button data-picker-close>Отмена</button></div>';
 d.showModal();
}

function render(){if(!moneyFrame)document.querySelector('#money').textContent=fmt(state.money);document.querySelector('#nav').innerHTML=['Крутка','Коллекция','Гараж','Магазин'].map(t=>'<button class="'+(t===tab?'active':'')+'" data-tab="'+t+'">'+t+(t==='Коллекция'?' · '+state.plates.length:'')+'</button>').join('');const m=document.querySelector('#main');
if(tab==='Крутка'){const a=assess(state.current);m.innerHTML='<p class="tag">ОХОТА ЗА КОМБИНАЦИЕЙ</p><h1>Твой следующий редкий номер.</h1><p class="muted">Меняй одну часть. Удачные буквы, цифры и регион остаются.</p><div class="hero"><section class="panel"><div class="stage" id="stage">'+plate(state.current)+'</div><div class="spinrow"><button data-spin="letters">Крутить буквы<small>300 ₽</small></button><button data-spin="digits">Крутить цифры<small>300 ₽</small></button><button data-spin="region">Крутить регион<small>150 ₽</small></button></div><div class="actions"><button class="gold" data-keep '+(!state.dirty||!completePlate(state.current)?'disabled':'')+'>'+(completePlate(state.current)?'В коллекцию':'Собери все части')+'</button><button data-ad '+(!sdk||adBusy?'disabled':'')+'>Реклама · +2 500 ₽</button><button data-free>Бесплатный номер</button><button data-reset>Очистить крутилку</button></div><p class="muted">Бесплатный номер раз в минуту, когда крутилка пуста. Реклама доступна после подключения к Яндекс Играм.</p></section><aside class="panel"><span class="badge">'+a.label+'</span><div class="value">'+fmt(a.value)+'</div><p class="muted">'+a.detail+'</p><hr style="border:0;border-top:1px solid #393b40;margin:25px 0"><h2>Сохрани или рискни</h2><p class="muted">Добавь номер в коллекцию. Там можно выбрать покупателя или поставить номер на свою машину.</p><p class="muted">Стартовый капитал — 25 000 ₽<br>Все сделки проходят за игровую валюту.</p><details class="rarity-guide"><summary>Редкость номеров</summary><p>Обычный — без повторов и особых серий.<br>Необычный — две одинаковые буквы или цифры.<br>Редкий — зеркальные цифры или особая комбинация.<br>Эпический — три одинаковые цифры, буквы или редкая серия.<br>Легендарный — три одинаковые цифры вместе с тремя одинаковыми буквами или редкой серией.</p></details></aside></div>'}
if(tab==='Коллекция'){m.innerHTML='<p class="tag">ТВОИ НАХОДКИ</p><h1>Коллекция номеров</h1><div class="grid">'+state.plates.map(p=>{let a=assess(p),installed=state.cars.find(c=>c.plate===p.id);return '<section class="panel card"><span class="badge">'+a.label+'</span>'+plate(p)+'<button data-bold="'+p.id+'" '+(p.bold||state.money<2000?'disabled':'')+'>'+(p.bold?'Жирный шрифт установлен':'Жирный шрифт · 2 000 ₽')+'</button><div class="value">'+fmt(a.value)+'</div><p class="muted">'+(installed?'Установлен: '+CARS.find(c=>c.id===installed.id).name:a.detail)+'</p><button data-sell="'+p.id+'" '+(installed?'disabled':'')+'>Предложения покупателей</button>'+'<div class="actions">'+(installed?'<button data-remove="'+installed.id+'">Снять с машины</button>':'<button class="gold" data-install-plate="'+p.id+'">Поставить на машину</button>')+'</div>'+'</section>'}).join('')+'</div>'+(state.plates.length?'':'<div class="empty">Сохрани первый номер на экране крутки.</div>')}
if(tab==='Магазин'){m.innerHTML='<p class="tag">ОТ КЛАССИКИ ДО МЕЧТЫ</p><h1>Автомагазин</h1><div class="grid">'+CARS.map(c=>'<section class="panel card"><h2>'+c.name+'</h2>'+car(c)+'<div class="value">'+fmt(c.price)+'</div><button class="gold" data-buy="'+c.id+'" '+(state.cars.some(x=>x.id===c.id)||state.money<c.price?'disabled':'')+'>'+(state.cars.some(x=>x.id===c.id)?'В гараже':'Купить машину')+'</button></section>').join('')+'</div>'}
if(tab==='Гараж'){m.innerHTML='<p class="tag">МАШИНЫ С ХАРАКТЕРОМ</p><h1>Твой гараж</h1><div class="grid">'+state.cars.map(owned=>{let c=CARS.find(c=>c.id===owned.id),p=state.plates.find(p=>p.id===owned.plate);return '<section class="panel card garage-card"><h2>'+c.name+'</h2>'+car(c,p)+'<div class="mount">'+(p?'<div class="garage-number">'+realisticPlate(p)+'</div>':'<div class="mount-empty">Место для твоего номера</div>')+'</div><div class="actions">'+(p?'<button data-remove="'+c.id+'">Снять номер</button>':'<button class="gold" data-picker="'+c.id+'">Выбрать номер</button>')+'</div></section>'}).join('')+'</div>'+(state.cars.length?'':'<div class="empty">Купи первую машину в магазине.</div>')}

refreshFree();
}
async function spin(part,free=false){if(busy||adBusy)return;const cost=free?0:{letters:300,digits:300,region:150}[part];if(state.money<cost)return notice('Не хватает денег. Продай номер из коллекции.');busy=true;const previousMoney=state.money;state.money-=cost;save();if(cost)animateSpend(previousMoney,cost);document.querySelectorAll('[data-spin],[data-keep],[data-tab],[data-free],[data-ad],[data-reset]').forEach(b=>b.disabled=true);const result=part==='letters'?Array.from({length:3},()=>pick(ABC)).join(''):part==='digits'?String(1+Math.floor(Math.random()*999)).padStart(3,'0'):pick(REGIONS);const preview={...state.current,[part]:result};document.querySelector('#stage').innerHTML=plate(preview);const faces=[...document.querySelectorAll('#stage [data-part="'+part+'"] .glyph-face')];const reels=faces.map((el,i)=>{el.parentElement.classList.add('rolling');el.innerHTML=Array.from({length:22+i*4},(_,j)=>'<span>'+ (j===21+i*4?result[i]:part==='letters'?pick(ABC):pick('0123456789'))+'</span>').join('');const animation=el.animate([{transform:'translateY(0)'},{transform:'translateY(-'+(21+i*4)+'em)'}],{duration:1100+i*220,easing:'cubic-bezier(.12,.62,.2,1)',fill:'forwards'});return animation.finished});await Promise.all(reels);state.current[part]=result;state.dirty=true;busy=false;save();render();}
function openSale(id){saleId=id;let p=state.plates.find(p=>p.id===id);if(!p||state.cars.some(c=>c.plate===id))return;let a=assess(p),d=document.querySelector('#sale');d.innerHTML='<h2>Выбери покупателя</h2>'+plate(p)+'<button class="offer" data-deal="safe"><strong>'+fmt(a.value*.65)+'</strong>Проверенный покупатель · оплата гарантирована</button><button class="offer" data-deal="risk"><strong>'+fmt(a.value*1.2)+'</strong>Чёрный рынок · риск обмана 30%</button><p class="muted">При обмане номер теряется, оплата не поступает.</p><button data-close>Оставить номер</button>';d.showModal()}

function hasDraft(){return Object.values(state.current).some(Boolean)}
function refreshFree(){const b=document.querySelector('[data-free]');if(!b)return;const left=Math.max(0,Math.ceil(((state.nextFreeAt||0)-Date.now())/1000));b.disabled=busy||adBusy||hasDraft()||left>0;b.textContent=left?'Бесплатный номер через '+left+' с':hasDraft()?'Сохрани номер для бесплатной крутки':'Бесплатный номер';}
async function freeRound(){if(busy||adBusy||hasDraft()||Date.now()<(state.nextFreeAt||0))return;state.nextFreeAt=Date.now()+60000;save();for(const part of ['letters','digits','region'])await spin(part,true);}
function rewarded(){if(!sdk||busy||adBusy)return;adBusy=true;let credited=false;render();sdk.features?.GameplayAPI?.stop();const end=()=>{adBusy=false;sdk.features?.GameplayAPI?.start();render()};try{sdk.adv.showRewardedVideo({callbacks:{onOpen(){},onRewarded(){if(credited)return;credited=true;state.money+=AD_REWARD;save();notice('За просмотр получено '+fmt(AD_REWARD))},onClose(){end()},onError(){end();notice('Реклама сейчас недоступна. Попробуй позже.')}}})}catch{end();notice('Не удалось запустить рекламу.')}}
function initAds(){if(location.protocol==='file:')return;const script=document.createElement('script');script.src='https://sdk.games.s3.yandex.net/sdk.js';script.onload=async()=>{try{sdk=await YaGames.init();sdk.features?.LoadingAPI?.ready();sdk.features?.GameplayAPI?.start();render()}catch{sdk=null}};document.head.appendChild(script)}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b||busy||adBusy)return;if(b.hasAttribute('data-reset')){state.current=emptyPlate();state.dirty=false;save();render();return}if(b.hasAttribute('data-ad')){rewarded();return}if(b.hasAttribute('data-free')){freeRound();return}if(b.dataset.viewCar)openCarView(b.dataset.viewCar);if(b.hasAttribute('data-car-close'))document.querySelector('#carview').close();if(b.dataset.tab){tab=b.dataset.tab;render()}if(b.dataset.spin)spin(b.dataset.spin);if(b.hasAttribute('data-keep')&&!busy&&state.dirty&&completePlate(state.current)){state.plates.unshift({...state.current,id:crypto.randomUUID()});state.current=emptyPlate();state.dirty=false;save();render();notice('Номер в коллекции. Собери новую комбинацию с нуля.')}if(b.dataset.sell)openSale(b.dataset.sell);if(b.hasAttribute('data-close'))document.querySelector('#sale').close();if(b.dataset.deal){let p=state.plates.find(p=>p.id===saleId);if(!p)return;const win=b.dataset.deal==='safe'||Math.random()>=.3;let price=Math.round(assess(p).value*(b.dataset.deal==='safe'?.65:1.2));state.plates=state.plates.filter(p=>p.id!==saleId);if(win)state.money+=price;state.deals++;saleId=null;document.querySelector('#sale').close();save();render();notice(win?'Продано! Получено '+fmt(price):'Покупатель обманул. Номер потерян, деньги не поступили.')}if(b.dataset.buy){let c=CARS.find(c=>c.id===b.dataset.buy);if(state.money>=c.price&&!state.cars.some(x=>x.id===c.id)){state.money-=c.price;state.cars.push({id:c.id,plate:null});save();render();notice(c.name+' теперь в гараже')}}if(b.dataset.bold){let p=state.plates.find(p=>p.id===b.dataset.bold);if(p&&!p.bold&&state.money>=2000){p.bold=true;state.money-=2000;save();render();notice('Жирное начертание установлено')}}if(b.dataset.installPlate)openCarPicker(b.dataset.installPlate);if(b.hasAttribute('data-picker-shop')){document.querySelector('#picker').close();tab='Магазин';render();return}if(b.dataset.pickCar){const c=state.cars.find(x=>x.id===b.dataset.pickCar);if(c&&!c.plate){pickerCar=c.id;document.querySelectorAll('[data-pick-car]').forEach(x=>{x.classList.toggle('selected',x.dataset.pickCar===pickerCar);x.setAttribute('aria-pressed',x.dataset.pickCar===pickerCar)});document.querySelector('[data-confirm-install]').disabled=false}}if(b.dataset.picker)openPicker(b.dataset.picker);if(b.hasAttribute('data-picker-close'))document.querySelector('#picker').close();if(b.dataset.pick){pickerPlate=b.dataset.pick;document.querySelectorAll('[data-pick]').forEach(x=>{x.classList.toggle('selected',x.dataset.pick===pickerPlate);x.setAttribute('aria-pressed',x.dataset.pick===pickerPlate)});document.querySelector('[data-confirm-install]').disabled=false}if(b.hasAttribute('data-confirm-install')){let c=state.cars.find(c=>c.id===pickerCar),p=state.plates.find(p=>p.id===pickerPlate);if(c&&p&&!c.plate&&!state.cars.some(c=>c.plate===p.id)){c.plate=p.id;save();document.querySelector('#picker').close();render();document.querySelectorAll('.mount').forEach(x=>x.classList.add('mounted'));notice('Номер установлен на '+CARS.find(x=>x.id===c.id).name)}}if(b.dataset.remove){state.cars.find(c=>c.id===b.dataset.remove).plate=null;save();render();notice('Номер возвращён в коллекцию')}});render();initAds();setInterval(refreshFree,1000);
</script></body></html>
